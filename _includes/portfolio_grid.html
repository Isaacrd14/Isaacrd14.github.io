<section id="portfolio" class="section-dark">
  <div class="container">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2 class="section-heading">Proyectos destacados</h2>
        <h3 class="section-subheading text-muted">Casos representativos de desarrollo empresarial, automatización e IA aplicada.</h3>
      </div>
    </div>
    <div class="portfolio-grid" role="list">
      {% for post in site.posts %}
        <article class="portfolio-item" role="listitem">
          <a href="#portfolioModal{{ post.modal-id }}" class="portfolio-link" data-toggle="modal" aria-label="Ver más de {{ post.title }}">
            <div class="portfolio-media">
              <img src="img/portfolio/{{ post.thumbnail }}" class="img-responsive" alt="{{ post.title }}">
              <div class="portfolio-hover">
                <div class="portfolio-hover-content"><i class="fa fa-eye"></i> Ver más</div>
              </div>
            </div>
            <div class="portfolio-caption">
              <h4>{{ post.title }}</h4>
              <p class="text-muted">{{ post.subtitle }}</p>
              <span class="portfolio-cta">Ver más <i class="fa fa-arrow-right" aria-hidden="true"></i></span>
            </div>
          </a>
        </article>
      {% endfor %}
    </div>
  </div>
</section>
