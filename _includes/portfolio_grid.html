<section id="portfolio" class="section-dark">
  <div class="container">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2 class="section-heading">Proyectos destacados</h2>
        <h3 class="section-subheading text-muted">Casos representativos de desarrollo empresarial, automatización e IA aplicada.</h3>
      </div>
    </div>
    <div class="row">
      {% for post in site.posts %}
        <div class="col-md-4 col-sm-6 portfolio-item">
          <a href="#portfolioModal{{ post.modal-id }}" class="portfolio-link" data-toggle="modal">
            <div class="portfolio-hover">
              <div class="portfolio-hover-content"><i class="fa fa-plus fa-2x"></i></div>
            </div>
            <img src="img/portfolio/{{ post.thumbnail }}" class="img-responsive img-centered" alt="{{ post.title }}">
          </a>
          <div class="portfolio-caption">
            <h4>{{ post.title }}</h4>
            <p class="text-muted">{{ post.subtitle }}</p>
          </div>
        </div>
      {% endfor %}
    </div>
  </div>
</section>
