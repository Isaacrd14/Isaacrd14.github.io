<section id="team" class="section-muted">
  <div class="container">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2 class="section-heading">{{ site.data.home.achievements.heading }}</h2>
      </div>
    </div>
    <div class="row">
      <div class="col-lg-10 col-lg-offset-1">
        <ul class="achievement-list">
          {% for achievement in site.data.home.achievements.items %}
            <li>{{ achievement }}</li>
          {% endfor %}
        </ul>
      </div>
    </div>
  </div>
</section>
