<section id="clients" class="section-dark">
  <div class="container">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2 class="section-heading">{{ site.data.home.formation.heading }}</h2>
      </div>
    </div>
    <div class="row formation-grid">
      <div class="col-md-6">
        <h4>Certificaciones y formación</h4>
        <ul class="formation-list">
          {% for item in site.data.home.formation.certifications %}
            <li>{{ item }}</li>
          {% endfor %}
        </ul>
      </div>
      <div class="col-md-6">
        <h4>Eventos y participación</h4>
        <ul class="formation-list">
          {% for item in site.data.home.formation.events %}
            <li>{{ item }}</li>
          {% endfor %}
        </ul>
      </div>
    </div>
  </div>
</section>
