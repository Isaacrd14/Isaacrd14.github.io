<section id="contact" class="section-muted section-contact">
  <div class="container">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2 class="section-heading">{{ site.data.home.contact.heading }}</h2>
        <p class="contact-text">{{ site.data.home.contact.text }}</p>
      </div>
    </div>
    <div class="row text-center">
      <div class="col-md-12">
        <a class="contact-mail" href="mailto:{{ site.data.home.contact.email }}">{{ site.data.home.contact.email }}</a>
      </div>
    </div>
    <div class="row text-center">
      <div class="col-md-12">
        <ul class="list-inline social-buttons social-buttons-large">
          {% for link in site.data.home.contact.links %}
            <li>
              <a href="{{ link.url }}" target="_blank" rel="noopener noreferrer" title="{{ link.label }}">
                <i class="fa fa-{{ link.icon }}"></i>
              </a>
            </li>
          {% endfor %}
        </ul>
      </div>
    </div>
  </div>
</section>
